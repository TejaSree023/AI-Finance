{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
        <div class="card shadow-sm border-0 rounded-3">
            <div class="card-body p-4 p-md-5">
                <h2 class="text-center mb-4 font-weight-bold">{{ legend }}</h2>
                <form method="POST" action="">
                    <div class="mb-3">
                        <label class="form-label">Amount (₹)</label>
                        <input type="number" step="0.01" class="form-control form-control-lg" name="amount" 
                               value="{{ expense.amount if expense else '' }}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Category</label>
                        <select class="form-select form-select-lg" name="category" required>
                            <option value="" disabled {% if not expense %}selected{% endif %}>Select a category</option>
                            {% for cat in categories %}
                                <option value="{{ cat }}" {% if expense and expense.category == cat %}selected{% endif %}>{{ cat }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Date</label>
                        <input type="date" class="form-control form-control-lg" name="date" 
                               value="{{ expense.date.strftime('%Y-%m-%d') if expense else '' }}" required>
                    </div>
                    <div class="mb-4">
                        <label class="form-label">Description (Optional)</label>
                        <input type="text" class="form-control form-control-lg" name="description" 
                               value="{{ expense.description if expense else '' }}">
                    </div>
                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-primary btn-lg">{{ 'Update Expense' if expense else 'Add Expense' }}</button>
                        <a href="{{ url_for('expenses.list_expenses') }}" class="btn btn-outline-secondary btn-lg">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
